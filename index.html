<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icono-app.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#140f0e" />
    <!-- Instalada en el teléfono se abre sin barra del navegador, como una app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goddess" />

    <title>Goddess Studio — Uñas, Pestañas y Cejas en Melipilla</title>
    <meta
      name="description"
      content="Esmaltado permanente, uñas acrílicas, extensión de pestañas y diseño de cejas en Melipilla. Agenda online con confirmación inmediata."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Goddess Studio" />
    <meta property="og:title" content="Goddess Studio — Uñas, Pestañas y Cejas" />
    <meta
      property="og:description"
      content="Agenda tu hora en segundos. Pago seguro y confirmación inmediata."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://goddessstudio.cl/" />
    <meta property="og:image" content="https://goddessstudio.cl/images/og-goddess.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="canonical" href="https://goddessstudio.cl/" />

    <!--
      Ficha del negocio para Google.

      Sin esto, un buscador ve una página bonita pero no sabe que detrás hay un
      estudio en Melipilla, con horario y teléfono: es lo que permite aparecer
      en las búsquedas locales del tipo "uñas cerca de mí".

      Falta `streetAddress`: la ficha es válida sin ella, pero para salir en
      Maps hace falta la dirección exacta del estudio.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "@id": "https://goddessstudio.cl/#estudio",
        "name": "Goddess Studio",
        "description": "Esmaltado permanente, uñas en gel, extensión de pestañas y diseño de cejas en Melipilla. Atención con hora reservada, una clienta a la vez.",
        "url": "https://goddessstudio.cl/",
        "telephone": "+56974095567",
        "email": "goddess.studio.melipilla@gmail.com",
        "image": "https://goddessstudio.cl/images/og-goddess.jpg",
        "priceRange": "$5.000 - $35.000 CLP",
        "currenciesAccepted": "CLP",
        "paymentAccepted": "Efectivo, Transferencia, Mercado Pago",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Melipilla",
          "addressRegion": "Región Metropolitana",
          "addressCountry": "CL"
        },
        "areaServed": { "@type": "City", "name": "Melipilla" },
        "sameAs": ["https://instagram.com/_goddess.studio_"],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "20:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "10:00",
            "closes": "15:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios",
          "itemListElement": [
            {
              "@type": "OfferCatalog",
              "name": "Uñas",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Esmaltado" }, "priceCurrency": "CLP", "price": "15000" },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Soft Gel" }, "priceCurrency": "CLP", "price": "22000" },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Builder Gel" }, "priceCurrency": "CLP", "price": "25000" }
              ]
            },
            {
              "@type": "OfferCatalog",
              "name": "Pestañas",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Pestañas Clásicas" }, "priceCurrency": "CLP", "price": "27000" },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Volumen 5D" }, "priceCurrency": "CLP", "price": "35000" }
              ]
            },
            {
              "@type": "OfferCatalog",
              "name": "Cejas",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Laminado de Cejas" }, "priceCurrency": "CLP", "price": "18000" }
              ]
            }
          ]
        }
      }
    </script>

    <!-- Cormorant Garamond para display, Jost para texto. preconnect adelanta
         el handshake y display=swap evita el bloqueo de render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
