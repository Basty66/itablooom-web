  <text x="32" y="44"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="400"
        fill="#e9c349" text-anchor="middle">G</text>
  <circle cx="47" cy="20" r="3" fill="#ffb2b9"/>
</svg>
